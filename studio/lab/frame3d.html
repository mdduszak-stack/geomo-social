<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/geomo-social/studio/engine/tokens.css">
<style>
html,body{margin:0;background:var(--ig-paper)}
#s{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--ig-paper);
  background-image:linear-gradient(var(--ig-grid) 1px,transparent 1px),linear-gradient(90deg,var(--ig-grid) 1px,transparent 1px);background-size:45px 45px}
.k{position:absolute;left:72px;top:150px;font:700 34px var(--font-display);color:var(--ig-navy)}
.t{position:absolute;left:72px;top:200px;font:800 92px/0.95 var(--font-display);letter-spacing:-0.02em;color:var(--ig-ink)}
.n{position:absolute;z-index:2;left:72px;bottom:72px;right:72px;font:400 34px/1.3 var(--font-serif);color:var(--ig-ink2)}
.logo{position:absolute;left:72px;top:72px;font:800 40px var(--font-display);color:var(--ig-ink)}
canvas{position:absolute;left:0;top:360px}
.lab{position:absolute;z-index:2;background:var(--ig-paper);padding:2px 8px;font:800 40px var(--font-display);color:var(--measure);opacity:0;white-space:nowrap}
</style>
<script type="importmap">{"imports":{"three":"/geomo/node_modules/three/build/three.module.js","three/addons/":"/geomo/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="s">
<div class="logo">Geomo</div>
<div class="k">Geometry, all the way round</div>
<div class="t">Canyon Grail Gen 3.<br>Size M.</div>
<div class="lab" id="lst">Stack 575</div><div class="lab" id="lre">Reach 411</div>
<div class="n" id="note">Drawn from the frame numbers: stack 575, reach 411, head angle 71.5°, chainstay 435, wheelbase 1062 mm.</div>
</div>
<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
const W=1080,H=820, css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={frame:css('--series-1'),wheel:css('--reference'),ink:css('--ig-ink'),meas:css('--measure')};
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1); document.getElementById('s').appendChild(r.domElement);
const scene=new THREE.Scene(); const cam=new THREE.PerspectiveCamera(24,W/H,10,20000);
// --- geometry (mm). x forward, y up, z to the drive side. Canyon Grail Gen 3 M (Geomo database, backup 2026-10-25)
const G={stack:575,reach:411,hta:71.5,sta:73.8,cs:435,drop:75,wb:1062,ht:138,stem:80,R:350};
const rad=d=>d*Math.PI/180, ra=-Math.sqrt(G.cs**2-G.drop**2), fa=ra+G.wb, ay=G.drop;
const htT=[G.reach,G.stack], htB=[G.reach+G.ht*Math.cos(rad(G.hta)), G.stack-G.ht*Math.sin(rad(G.hta))];
const stY=545, stT=[-stY/Math.tan(rad(G.sta)),stY];
const P=(x,y,z=0)=>new THREE.Vector3(x,y,z);
const parts=[]; // {pts, color, width, t0, dur}
function add(pts,color,width,t0,dur){parts.push({pts,color,width,t0,dur});}
const circle=(cx,cy,z,R,n=96)=>Array.from({length:n+1},(_,i)=>P(cx+R*Math.cos(i/n*2*Math.PI),cy+R*Math.sin(i/n*2*Math.PI),z));
// wheels + axles
add(circle(ra,ay,0,G.R),C.wheel,3,0.2,1.2); add(circle(fa,ay,0,G.R),C.wheel,3,0.3,1.2);
add([P(ra,ay,-70),P(ra,ay,70)],C.wheel,3,0.9,0.4); add([P(fa,ay,-55),P(fa,ay,55)],C.wheel,3,0.9,0.4);
// main triangle (centre plane)
add([P(0,0),P(...stT)],C.frame,9,0.6,0.7);           // seat tube
add([P(...stT),P(...htT)],C.frame,9,0.8,0.7);         // top tube
add([P(...htT),P(...htB)],C.frame,9,1.0,0.4);         // head tube
add([P(...htB),P(0,0)],C.frame,9,1.1,0.7);            // down tube
// stays split left/right
for(const s of[-1,1]){ add([P(0,0,s*38),P(ra,ay,s*62)],C.frame,7,1.3,0.7); add([P(stT[0]*0.92,stT[1]*0.92,s*22),P(ra,ay,s*62)],C.frame,7,1.4,0.7);
  add([P(htB[0],htB[1],s*20),P(fa,ay,s*52)],C.frame,7,1.5,0.6); }               // fork legs
add([P(0,0,-80),P(0,0,80)],C.frame,7,1.6,0.3);                                    // BB shell
// cockpit: stem + drop bar (width 420)
const sp=[htT[0]-10*Math.cos(rad(G.hta)), htT[1]+10*Math.sin(rad(G.hta))];
const bc=[sp[0]+G.stem*Math.cos(rad(-6)), sp[1]+G.stem*Math.sin(rad(-6))];
add([P(...sp),P(...bc)],C.ink,6,1.7,0.4);
add([P(bc[0],bc[1],-210),P(bc[0],bc[1],210)],C.ink,6,1.9,0.5);
for(const s of[-1,1]){const d=[];for(let i=0;i<=24;i++){const a=i/24*Math.PI*1.15; d.push(P(bc[0]+75*Math.sin(a), bc[1]-60+60*Math.cos(a)-(i>12?(i-12)*3:0), s*210));} add([P(bc[0],bc[1],s*210),...d],C.ink,6,2.0,0.6);}
// dimension lines (shown at the end, side view)
const dimS=[P(G.reach+90,0,0),P(G.reach+90,G.stack,0)], dimR=[P(0,G.stack+90,0),P(G.reach,G.stack+90,0)];
const lines=parts.map(p=>{const g=new LineGeometry(); g.setPositions(p.pts.flatMap(v=>[v.x,v.y,v.z])); const m=new LineMaterial({color:p.color,linewidth:p.width,transparent:true,resolution:new THREE.Vector2(W,H)});
  const l=new Line2(g,m); l.computeLineDistances(); scene.add(l); return {l,g,m,p,n:p.pts.length-1};});
const mk=(a,b)=>{const g=new LineGeometry(); g.setPositions([a.x,a.y,a.z,b.x,b.y,b.z]); const m=new LineMaterial({color:C.meas,linewidth:4,transparent:true,opacity:0,resolution:new THREE.Vector2(W,H)}); const l=new Line2(g,m); scene.add(l); return m;};
const dm=[mk(...dimS),mk(...dimR), mk(P(-40,0),P(G.reach+120,0)), mk(P(G.reach-20,G.stack),P(G.reach+120,G.stack))];
dm[2].dashed=dm[3].dashed=false;
const ease=x=>x<0?0:x>1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const target=P(102,250,0), dist=3900;
function proj(v){const p=v.clone().project(cam); return [(p.x+1)/2*W,(1-p.y)/2*H+360];}
window.renderAt=function(t){ // t in seconds, total 7
  for(const o of lines){const k=Math.max(0,Math.min(1,(t-o.p.t0)/o.p.dur)); o.g.instanceCount=Math.max(0,Math.round(ease(k)*o.n)); o.l.visible=k>0;}
  // camera: side -> 3/4 -> side
  const a = ease((t-2.3)/1.8)*1 - ease((t-4.6)/1.6)*1;  // 0..1..0
  const yaw=rad(-52)*a, pitch=rad(16)*a;
  cam.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch), target.y+dist*Math.sin(pitch), target.z+dist*Math.cos(yaw)*Math.cos(pitch));
  cam.lookAt(target);
  const da=Math.max(0,Math.min(1,(t-6.1)/0.6)); dm.forEach(m=>m.opacity=da);
  const [sx,sy]=proj(P(G.reach+90,G.stack/2)), [rx,ry]=proj(P(G.reach/2,G.stack+90));
  const ls=document.getElementById('lst'), lr=document.getElementById('lre');
  ls.style.left=(sx+18)+'px'; ls.style.top=(sy-24)+'px'; ls.style.opacity=da; lr.style.left=(rx-90)+'px'; lr.style.top=(ry-62)+'px'; lr.style.opacity=da;
  r.render(scene,cam);
};
await document.fonts.ready; window.renderAt(0); window.__ready=true;
</script></body></html>
